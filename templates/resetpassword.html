<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandi Baru - SmartMonitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;

            background: linear-gradient(rgba(27, 36, 49, 0.75),
                rgba(27, 36, 49, 0.75)),
            url("{{ url_for('static', filename='bg-depan.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
        }
    </style>

    <div class="login-container">
        <div class="login-card">
            <h2 class="form-title">Buat Kata Sandi<br>Baru</h2>
            <p class="form-subtitle"
                style="text-align: center; font-size: 0.95rem; color: #ccc; margin-top: -20px; margin-bottom: 30px;">
                Silakan masukkan kata sandi baru Anda.
            </p>

            <form action="/reset-password/{{ token }}" method="POST">
                <div class="input-group">
                    <label for="password">Kata Sandi Baru</label>
                    <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" minlength="8"
                        required>
                </div>

                <button type="submit" class="btn-submit">Simpan Sandi Baru</button>
            </form>
        </div>
    </div>
</body>

</html>
