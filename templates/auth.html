<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otentikasi - SmartMonitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(rgba(27, 36, 49, 0.75), rgba(27, 36, 49, 0.75)), url("{{ url_for('static', filename='bg-depan.jpg') }}");
            background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white;
        }
        .auth-card {
            background-color: transparent !important; backdrop-filter: blur(1px); border: 2px solid #fae115;
            width: 100%; max-width: 420px; padding: 40px 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); animation: fadeIn 0.6s ease-out forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h2 { text-align: center; margin-bottom: 25px; font-weight: 800; font-size: 1.8rem; }
        
        .tab-container { display: flex; background-color: #0f172a; border-radius: 8px; padding: 5px; margin-bottom: 25px; }
        .tab-btn { flex: 1; border: none; background: transparent; padding: 10px; border-radius: 6px; font-weight: 600; color: #9ca3af; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background-color: #fae115; color: #111827; }
        .alert { padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 20px; text-align: center; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
        
        input { width: 100%; padding: 14px 18px; margin-bottom: 15px; border: none; border-radius: 8px; font-size: 0.95rem; color: white; background-color: #0f172a; outline: none; }
        input:focus { outline: 1px solid #fae115; }
        
        /* Input Khusus Password (diberi padding kanan agar teks tidak menabrak ikon mata) */
        input[type="password"], input.pass-field { padding-right: 45px; }
        
        /* STRUKTUR EYE ICON TENGAH-KANAN SEMPURNA */
        .password-wrapper { 
            position: relative; 
            display: flex; 
            align-items: center; 
            width: 100%;
        }
        .toggle-password {
            position: absolute; 
            right: 18px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #6b7280; 
            cursor: pointer; 
            font-size: 1rem; 
            z-index: 10;
            line-height: 1;
            display: flex;
            align-items: center;
        }
        .toggle-password:hover { color: #fae115; }

        .submit-btn { width: 100%; padding: 14px; background-color: #fae115; color: #111827; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; }
        .kode-container { display: flex; gap: 10px; align-items: flex-start; width: 100%; }
        .kode-btn { padding: 0 15px; background: #fae115; color: #111827; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; height: 48px; font-size: 0.95rem; }
        .forgot-link { display: block; color: #fae115; font-size: 0.8rem; margin-top: -5px; margin-bottom: 25px; text-decoration: none; font-weight: 500; }
        .forgot-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 id="form-title">Form Masuk</h2>

        <div class="tab-container">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Masuk</button>
            <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Daftar</button>
        </div>

        {% with messages = get_flashed_messages() %}{% if messages %}{% for message in messages %}
        <div class="alert">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}

        <form id="form-login" action="/masuk" method="POST">
            <input type="email" name="email" placeholder="Masukan Email" required>
            <div class="password-wrapper">
                <input type="password" id="login-pass" name="password" placeholder="Masukan Password" required>
                <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePass('login-pass', this)"></i>
            </div>
            <a href="/lupa-kata-sandi" class="forgot-link">Lupa password?</a>
            <button type="submit" class="submit-btn">MASUK</button>
        </form>

        <form id="form-register" action="/daftar" method="POST" style="display: none;">
            <input type="text" name="nama" placeholder="Nama lengkap" required>
            
            <div class="kode-container">
                <input type="email" name="email" id="reg-email" placeholder="Masukan Email" required>
                <button type="button" class="kode-btn" onclick="kirimKode()">KODE</button>
            </div>
            
            <input type="text" name="kode_verifikasi" placeholder="Masukan Kode Verifikasi" required>
            
            <div class="password-wrapper">
                <input type="password" id="reg-password" name="password" class="pass-field" placeholder="Masukan Password" required onkeyup="checkPasswordMatch()">
                <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePass('reg-password', this)"></i>
            </div>
            
            <div class="password-wrapper">
                <input type="password" id="reg-password-confirm" class="pass-field" placeholder="Ulangi password" required onkeyup="checkPasswordMatch()">
                <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePass('reg-password-confirm', this)"></i>
            </div>
            
            <p id="password-error" style="color: #ef4444; font-size: 0.75rem; margin-top: -5px; margin-bottom: 15px; display: none; font-weight: 500;">Password tidak cocok!</p>
            <button type="submit" class="submit-btn" id="btn-daftar">DAFTAR</button>
        </form>
    </div>

    <script>
        function togglePass(id, icon) {
            const input = document.getElementById(id);
            input.type = (input.type === "password") ? "text" : "password";
            icon.classList.toggle("fa-eye-slash");
            icon.classList.toggle("fa-eye");
        }

        function switchTab(tab) {
            const isLogin = (tab === 'login');
            document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
            document.getElementById('form-register').style.display = isLogin ? 'none' : 'block';
            document.getElementById('tab-login').classList.toggle('active', isLogin);
            document.getElementById('tab-register').classList.toggle('active', !isLogin);
            document.getElementById('form-title').innerText = isLogin ? 'Form Masuk' : 'Form Registrasi';
        }

        function checkPasswordMatch() {
            const p1 = document.getElementById('reg-password').value;
            const p2 = document.getElementById('reg-password-confirm').value;
            const err = document.getElementById('password-error');
            const btn = document.getElementById('btn-daftar');
            
            if(p2 !== '') { 
                if (p1 === p2) {
                    err.style.display = 'none'; 
                    btn.disabled = false;
                } else {
                    err.style.display = 'block'; 
                    btn.disabled = true;
                }
            }
        }

        function kirimKode() {
            const email = document.getElementById('reg-email').value;
            if(!email) return alert("Masukkan email terlebih dahulu!");
            
            fetch('/kirim-kode', {
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({email: email})
            })
            .then(res => res.json())
            .then(data => alert(data.message))
            .catch(err => alert("Gagal mengirim kode. Coba lagi."));
        }

        window.onload = () => { 
            if("{{ active_tab | default('login') }}" === 'register') {
                switchTab('register');
            } 
        };
    </script>
</body>
</html>
